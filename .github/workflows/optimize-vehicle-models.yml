name: Optimize vehicle models

on:
  push:
    paths:
      - 'assets/new-models/**'
      - 'scripts/optimize-vehicle-models.mjs'
      - '.github/workflows/optimize-vehicle-models.yml'
  pull_request:
    paths:
      - 'assets/new-models/**'
      - 'scripts/optimize-vehicle-models.mjs'
      - '.github/workflows/optimize-vehicle-models.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install optimizer
        run: npm install --no-save --ignore-scripts @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer sharp

      - name: Build mobile GLBs
        run: node scripts/optimize-vehicle-models.mjs

      - name: Upload optimized models
        uses: actions/upload-artifact@v4
        with:
          name: game-models
          path: assets/game-models/*.glb
          if-no-files-found: error

      - name: Commit optimized models
        run: |
          if [ -z "$(git status --porcelain -- assets/game-models)" ]; then
            echo 'No model changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/game-models
          git commit -m 'Build mobile vehicle models'
          git push
